{% extends "base.html" %}

{% block content %}
    <div class="container">
        <form action='{% url "editarLibros" libro.pk %}' method='POST'>
        {% csrf_token %}
            <div class="mb-3">
                <label for='titulo' class='form-label'>Titulo</label>
                <input id='titulo'
                type='text'
                name='titulo'
                class='form-control'
                value='{{libro.titulo}}'>
            </div>
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripcion</label>
                <textarea id="descripcion"  
                name="descripcion" 
                class="form-control"
                >{{libro.descripcion}}
            </textarea>
            </div>
            <div class="mb-3">
            <label  class='form-label' for='autor'>Autores</label>
            <select name="autor" class='form-control' id='autor' required>
                {% for autor in autores %}
                    <option value='{{autor.id}}' 
                        {% if autor.id == libro.autor_id.pk %}
                        selected
                        {% endif %}
                    >{{ autor.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <input type="submit" class="btn btn-success" value="Actualizar"/>
        </form>
        <div class="container mb-2">
            <form action='{% url "eliminarLibros" libro.pk %}' method='POST'>
                {% csrf_token %}
                <input type="submit" class="btn btn-danger" value="Eliminar"/>
            </form>
        </div>
    </div>

{% endblock content %}
